name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install Clang 22
        run: |
          wget --quiet https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install --yes --no-install-recommends clang-tools-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - run: make lint
      - run: go test -race ./...

  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go test ./...
