name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install Clang module tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-tools-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - run: make lint
      - run: make test
